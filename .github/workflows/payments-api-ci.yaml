name: Payments API CI

on:
  push:
    branches:
      - main
    paths:
      - "services/examples/payments-api/**"
      - ".github/workflows/payments-api-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "services/examples/payments-api/**"
      - ".github/workflows/payments-api-ci.yaml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/examples/payments-api/requirements.txt

      - name: Install dependencies
        working-directory: services/examples/payments-api
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: services/examples/payments-api
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build \
            -t payments-api:${{ github.sha }} \
            services/examples/payments-api

  publish-image:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/examples/payments-api
          push: true
          tags: ghcr.io/hasan-razibul/payments-api:${{ github.sha }}