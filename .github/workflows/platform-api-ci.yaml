name: Platform API CI

on:
  push:
    branches:
      - main
    paths:
      - "platform/platform-api/**"
      - ".github/workflows/platform-api-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "platform/platform-api/**"
      - ".github/workflows/platform-api-ci.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Test Platform API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/platform-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/platform-api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest httpx

      - name: Run tests
        run: python -m pytest -v tests/