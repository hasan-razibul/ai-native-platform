name: Payments API CI

on:
  push:
    branches:
      - main
    paths:
      - "services/examples/payments-api/**"
      - ".github/workflows/payments-api-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "services/examples/payments-api/**"
      - ".github/workflows/payments-api-ci.yaml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/examples/payments-api/requirements.txt

      - name: Install dependencies
        working-directory: services/examples/payments-api
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: services/examples/payments-api
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build \
            -t payments-api:${{ github.sha }} \
            services/examples/payments-api